[package]
name = "jules-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Facade crate for Google's Jules SDK"

[lints]
workspace = true

[dependencies]
jules-core = { workspace = true }
jules-api = { workspace = true }
jules-macros = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[features]
# The default feature set provides the recommended experience for most users.
default = ["streaming", "tools"]

# Streaming APIs, stream event handling, async stream abstractions, incremental responses.
streaming = ["jules-api/streaming", "jules-core/streaming"]

# Tool calling support, tool abstractions, tool execution APIs, tool response handling.
tools = ["jules-api/tools", "jules-core/tools"]

# Request middleware, response middleware, middleware composition, request interception.
middleware = ["jules-api/middleware", "jules-core/middleware"]

# Metrics support, tracing integrations, diagnostics capabilities, performance instrumentation.
telemetry = ["jules-api/telemetry", "jules-core/telemetry"]

# Official CLI support, interactive commands, configuration management, diagnostic tooling.
cli = ["jules-api/cli", "jules-core/cli"]

# WebAssembly support, browser compatibility, WASM-specific abstractions.
wasm = ["jules-api/wasm", "jules-core/wasm"]

# Experimental functionality, preview APIs, prototype implementations. (Not considered stable)
experimental = ["jules-api/experimental", "jules-core/experimental"]
