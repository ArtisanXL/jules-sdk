[package]
name = "jules-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Core abstractions and traits for Jules-SDK"
keywords = ["jules", "google", "sdk", "async"]
categories = ["api-bindings", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = { version = "0.1.44", features = ["log"] }
tokio = { version = "1.53.1", features = ["time"], optional = true }

[features]
# The default feature set provides the recommended experience for most users.
default = ["streaming", "tools"]

# Streaming APIs, stream event handling, async stream abstractions, incremental responses.
streaming = []

# Tool calling support, tool abstractions, tool execution APIs, tool response handling.
tools = []

# Request middleware, response middleware, middleware composition, request interception.
middleware = ["dep:tokio"]

# Metrics support, tracing integrations, diagnostics capabilities, performance instrumentation.
telemetry = []

# Official CLI support, interactive commands, configuration management, diagnostic tooling.
cli = []

# WebAssembly support, browser compatibility, WASM-specific abstractions.
wasm = []

# Experimental functionality, preview APIs, prototype implementations. (Not considered stable)
experimental = []

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
wasm-bindgen-test = "0.3.45"
